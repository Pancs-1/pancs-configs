[main]
font=JetBrainsMono Nerd Font:size=11, Symbols Nerd Font:size=11
font-bold=JetBrainsMono Nerd Font:style=Bold:size=11
font-italic=JetBrainsMono Nerd Font:style=Italic:size=11
font-bold-italic=JetBrainsMono Nerd Font:style=Bold Italic:size=11

initial-window-size-pixels=850x520
pad=16x16
resize-delay-ms=5


[cursor]
style=beam
blink=no
beam-thickness=1.5

[mouse]
hide-when-typing=yes

[colors-dark]
# 92% Oppacity for a subtle translucent look
alpha=0.85
blur=yes
# Catppuccin Macchiato Palette
background=000000
foreground=e0e0e0

# Scrollback search highlights
search-box-no-match=24273a ed8796
search-box-match=24273a a6da95

[url]
osc8-underline=always
label-letters=sadfjklewcmpgh

[key-bindings]
# Modern, intuitive keybindings
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+f
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0

[search-bindings]
cancel=Escape Control+g
commit=Return
find-prev=Control+p
find-next=Control+n

