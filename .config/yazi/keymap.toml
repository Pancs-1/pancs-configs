[[mgr.prepend_keymap]]
on  = "Y"
run = "plugin clipboard -- --action=copy"
desc = "Yank selected files to clipboard (copy)"

# Keep behaviour consistent with cut
[[mgr.prepend_keymap]]
on  = "x"
run = [ "yank --cut", 'plugin clipboard -- --action=copy' ]
desc = "Yank selected files (cut)"

# Paste files from the system clipboard into the current directory
[[mgr.prepend_keymap]]
on  = "<C-p>"
run = [ 'plugin clipboard -- --action=paste' ]
desc = "Paste yanked files from clipboard"

[[mgr.prepend_keymap]]
on  = ["g", "V"]
run = [ 'cd /run/media/pancsrah/VAULT' ]
desc = "jump to VAULT"

[[mgr.prepend_keymap]]
on   = "!"
for  = "unix"
run  = 'shell "$SHELL" --block'
desc = "Open $SHELL here"
