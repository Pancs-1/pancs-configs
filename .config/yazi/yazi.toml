[opener]
edit = [ { run = 'nvim %s', block = true, desc = "Neovim" } ]
pdf  = [ { run = 'zathura %s', orphan = true, desc = "Zathura" } ]

sxiv = [ { run = 'sxiv %s', orphan = true, desc = "SXIV"} ]
gimp = [ { run = 'gimp %s', orphan = true, desc = "Gimp"} ]

mpv  = [ { run = 'mpv %s', orphan = true, desc = "MPV"} ]
vlc  = [ { run = 'vlc %s', orphan = true, desc = "VLC"} ]

[open]
prepend_rules = [
    { url = "*.pdf", use = "pdf" },
    { mime = "application/pdf", use = "pdf" },
    { mime = "image/*", use = ["sxiv", "gimp"] },
    { mime = "video/*", use = ["mpv", "vcl"] }

] 
